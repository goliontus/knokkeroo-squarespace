</style>

<script>
(function () {
  var APPLE_URL = 'https://apps.apple.com/app/id6776208791';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.goliontus.knokker';
  var HUAWEI_URL = 'https://appgallery.cloud.huawei.com/appDetail?pkgName=com.goliontus.knokker';

  var ua = (navigator.userAgent || '').toLowerCase();
  var isIOS = /iphone|ipad|ipod/.test(ua);
  var isHuawei = /huawei|honor|harmonyos/.test(ua);
  var isAndroid = /android/.test(ua);
  var isMobile = isIOS || isAndroid || isHuawei;

  var title = document.getElementById('kk-go-title');
  var sub = document.getElementById('kk-go-sub');

  function go(url) {
    window.location.replace(url);
  }

  if (isIOS) {
    title.textContent = 'Taking you to the App Store…';
    go(APPLE_URL);
  } else if (isHuawei) {
    title.textContent = 'Taking you to AppGallery…';
    go(HUAWEI_URL);
  } else if (isAndroid) {
    title.textContent = 'Taking you to Google Play…';
    go(PLAY_URL);
  } else {
    document.querySelector('.kk-go__spinner').style.display = 'none';
    title.textContent = 'Get knokkeroo';
    sub.textContent = 'Scan this on your phone, or pick your store below.';
    document.getElementById('kk-go-qr').style.display = 'block';
  }
})();
</script>
